name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra inference
      - run: uv run --locked --extra dev --extra inference python -m pytest -m "not gpu and not model"
      - run: uv run --locked --extra dev --extra inference python -m ruff check .
      - run: uv run --locked --extra dev --extra inference python -m ruff format --check .
      - run: uv run --locked --extra dev --extra inference python -m mypy
